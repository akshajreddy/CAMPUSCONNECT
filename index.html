<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect – Everything Campus, All in One Place</title>
  <meta name="description" content="The all-in-one platform for college students. Discover events, connect with clubs, buy and sell, find lost items, and meet roommates or project teammates.">

  <!-- Tailwind CSS Play CDN -->

  <script>

              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb', // primary blue
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#172554',
            },
            accent: {

            'pulse-subtle': 'pulseSubtle 3s ease-in-out infinite',

          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },

            pulseSubtle: {

  <!-- React 18, ReactDOM 18 and Babel Standalone for Seamless Browser Rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <style>
    /* Custom scrollbar and backdrop utilities */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .mesh-gradient {
      background-color: #ffffff;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(124, 58, 237, 0.09) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(59, 130, 246, 0.04) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(219, 234, 254, 0.5) 0px, transparent 50%);
    }

    .dark-mesh-gradient {
      background-color: #0b1120;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(124, 58, 237, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(30, 58, 138, 0.3) 0px, transparent 50%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    
    .glass-card-hover {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(37, 99, 235, 0.12), 0 0 1px 1px rgba(37, 99, 235, 0.1);
      border-color: rgba(147, 197, 253, 0.8);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- ICON SYSTEM (High-performance, Zero-dependency SVG Icons) ---

              <stop offset="0%" stopColor="#2563eb" />
              <stop offset="50%" stopColor="#3b82f6" />

            <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#60a5fa" />

            </linearGradient>
          </defs>
          <rect width="36" height="36" rx="10" fill="url(#logo-grad)" />
          {/* Mortarboard Academic Cap */}

          {/* Tassel node & network spark */}
          <path d="M28 15V22" stroke="#c084fc" strokeWidth="2" strokeLinecap="round" />
          <circle cx="28" cy="22.5" r="1.5" fill="#f3e8ff" />
          <circle cx="18" cy="21" r="2.5" fill="url(#node-grad)" stroke="white" strokeWidth="1.2" />

      ),
      Check: ({ className = "w-5 h-5 text-emerald-500" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
        </svg>
      ),
      ArrowRight: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />

      ),

      ),
      BellOff: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
      ),
      Layers: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
      ),
      Compass: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm-1.5-6.5l4-1.5-1.5 4-4 1.5 1.5-4z" />
        </svg>
      ),
      AlertTriangle: ({ className = "w-6 h-6 text-amber-500" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      ),
      MessageSquareX: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      ),
      Close: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      ),
      Menu: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      ),
      Mail: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      ),
      MapPin: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      ),
      ExternalLink: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />

      ),
      Copy: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
      ),
      GraduationCap: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">

    // --- TOAST NOTIFICATION COMPONENT ---
    const Toast = ({ message, type = "info", onClose }) => {
      useEffect(() => {
        const timer = setTimeout(() => {
          onClose();
        }, 4000);
        return () => clearTimeout(timer);
      }, [onClose]);

      return (
        <div className="fixed bottom-6 right-6 z-50 flex items-center space-x-3 bg-navy-900 text-white px-5 py-3.5 rounded-xl shadow-2xl border border-slate-700 animate-bounce duration-500">
          <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
          <span className="text-sm font-medium">{message}</span>
          <button onClick={onClose} className="text-slate-400 hover:text-white ml-2">
            <Icons.Close className="w-4 h-4" />
          </button>
        </div>
      );
    };

    // --- NAVIGATION COMPONENT ---
    const Navbar = ({ onOpenGetStarted, onNavigate }) => {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 20) {
            setIsScrolled(true);
          } else {
            setIsScrolled(false);
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navItems = [
        { label: "Home", href: "#hero" },
        { label: "The Problem", href: "#problem" },
        { label: "Features", href: "#features" },
        { label: "Why CampusConnect", href: "#why-us" },
        { label: "How It Works", href: "#how-it-works" }
      ];

      return (
        <header className={`fixed top-0 left-0 right-0 z-40 transition-all duration-300 ${
          isScrolled 
            ? "bg-white/90 backdrop-blur-md shadow-sm border-b border-slate-200/80 py-3" 
            : "bg-transparent py-5"
        }`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between">
              
              {/* Brand Logo */}
              <a href="#hero" className="flex items-center space-x-3 group cursor-pointer">
                <Icons.Logo className="w-9 h-9 transition-transform group-hover:scale-105" />
                <div className="flex flex-col">
                  <div className="flex items-center space-x-1.5">
                    <span className="text-xl font-extrabold tracking-tight text-slate-900 font-sans">
                      Campus<span className="text-brand-600">Connect</span>
                    </span>
                    <span className="hidden sm:inline-block text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-accent-100 text-accent-700 border border-accent-200">
                      Prototype
                    </span>
                  </div>
                  <span className="text-[10px] font-medium text-slate-500 tracking-wide hidden sm:block">
                    All-in-One Campus Network
                  </span>
                </div>
              </a>

              {/* Desktop Navigation Links */}
              <nav className="hidden md:flex items-center space-x-1 lg:space-x-2">
                {navItems.map((item) => (
                  <a
                    key={item.label}
                    href={item.href}
                    className="px-3.5 py-2 text-sm font-semibold text-slate-600 hover:text-brand-600 hover:bg-brand-50/60 rounded-lg transition-colors"
                  >
                    {item.label}
                  </a>
                ))}
              </nav>

              {/* CTA Buttons */}
              <div className="hidden sm:flex items-center space-x-3">
                <a
                  href="#features"
                  className="px-4 py-2 text-sm font-semibold text-slate-700 hover:text-brand-600 transition-colors"
                >
                  Explore Features
                </a>
                <button
                  onClick={() => onOpenGetStarted('student')}
                  className="relative group overflow-hidden px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 via-brand-700 to-accent-700 text-white text-sm font-semibold shadow-md shadow-brand-500/20 hover:shadow-lg hover:shadow-brand-500/30 transition-all active:scale-95"
                >
                  <span className="relative z-10 flex items-center space-x-1.5">
                    <span>Get Started</span>
                    <Icons.ArrowRight className="w-4 h-4 group-hover:translate-x-0.5 transition-transform" />
                  </span>
                </button>
              </div>

              {/* Mobile Menu Button */}
              <div className="md:hidden flex items-center space-x-2">
                <button
                  onClick={() => onOpenGetStarted('student')}
                  className="px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-semibold"
                >
                  Get Started
                </button>
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 focus:outline-none"
                  aria-label="Toggle navigation menu"
                >
                  {mobileMenuOpen ? <Icons.Close className="w-6 h-6" /> : <Icons.Menu className="w-6 h-6" />}
                </button>
              </div>

            </div>
          </div>

          {/* Mobile Drawer */}
          {mobileMenuOpen && (
            <div className="md:hidden bg-white/98 backdrop-blur-xl border-b border-slate-200 px-4 pt-3 pb-6 shadow-xl animate-in slide-in-from-top-2 duration-200">
              <div className="flex flex-col space-y-2">
                {navItems.map((item) => (
                  <a
                    key={item.label}
                    href={item.href}
                    onClick={() => setMobileMenuOpen(false)}
                    className="px-4 py-2.5 rounded-lg text-base font-semibold text-slate-700 hover:bg-brand-50 hover:text-brand-600"
                  >
                    {item.label}

            {/* Prominent Action Button */}
            <div className="pt-6 flex flex-col sm:flex-row items-center justify-center space-y-3 sm:space-y-0 sm:space-x-4">
              <button
                onClick={() => onOpenGetStarted('student')}
                className="w-full sm:w-auto px-9 py-4 rounded-xl bg-white hover:bg-slate-100 text-slate-900 font-extrabold text-base shadow-2xl hover:shadow-white/20 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center space-x-2"
              >
                <span>Get Started</span>
                <Icons.ArrowRight className="w-5 h-5 text-brand-600" />
              </button>

              <button
                onClick={() => onOpenGetStarted('university')}
                className="w-full sm:w-auto px-7 py-4 rounded-xl bg-white/10 hover:bg-white/15 text-white font-bold text-base border border-white/20 backdrop-blur-sm transition-all"
              >
                <span>For Colleges & Club Leads</span>
              </button>
            </div>

            <p className="text-xs text-slate-400 pt-4">
              Early Prototype Preview • No credit card required • Student verified
            </p>

          </div>
        </section>
      );
    };

    // --- SECTION 7: FOOTER ---
    const Footer = ({ onOpenContactModal, onTriggerToast }) => {
      const emailPlaceholder = "[Your Email Address]";

      const handleCopyEmail = (e) => {
        e.preventDefault();
        navigator.clipboard?.writeText(emailPlaceholder);
        onTriggerToast("Email placeholder copied to clipboard!");
      };

      return (
        <footer className="bg-navy-950 text-slate-400 pt-16 pb-12 border-t border-slate-800">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-10 pb-12 border-b border-slate-800">
              
              {/* Brand Column */}
              <div className="lg:col-span-2 space-y-4">
                <div className="flex items-center space-x-3">
                  <Icons.Logo className="w-9 h-9" />
                  <span className="text-2xl font-black text-white tracking-tight">
                    Campus<span className="text-brand-400">Connect</span>
                  </span>
                </div>
                <p className="text-sm text-slate-400 leading-relaxed max-w-sm">
                  The all-in-one campus platform that brings essential student activities and services together in one place. Simple, organized, and genuinely connected.
                </p>
                <div className="pt-2 text-xs text-slate-500">
                  <span className="inline-block px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-slate-400">
                    Innovative Startup Prototype
                  </span>
                </div>
              </div>

              {/* Navigation Links Column */}
              <div className="space-y-3">
                <h4 className="text-sm font-bold text-white uppercase tracking-wider">Navigation</h4>
                <ul className="space-y-2 text-sm">
                  <li><a href="#hero" className="hover:text-white transition-colors">Home</a></li>
                  <li><a href="#features" className="hover:text-white transition-colors">Features</a></li>
                  <li><a href="#problem" className="hover:text-white transition-colors">The Problem</a></li>
                  <li><a href="#why-us" className="hover:text-white transition-colors">Why CampusConnect</a></li>
                  <li><a href="#how-it-works" className="hover:text-white transition-colors">How It Works</a></li>
                </ul>
              </div>

              {/* Five Core Modules Links Column */}
              <div className="space-y-3">
                <h4 className="text-sm font-bold text-white uppercase tracking-wider">Core Modules</h4>
                <ul className="space-y-2 text-sm">
                  <li><a href="#features" className="hover:text-white transition-colors">Buy & Sell</a></li>
                  <li><a href="#features" className="hover:text-white transition-colors">Lost & Found</a></li>
                  <li><a href="#features" className="hover:text-white transition-colors">Events & RSVPs</a></li>
                  <li><a href="#features" className="hover:text-white transition-colors">Clubs Directory</a></li>
                  <li><a href="#features" className="hover:text-white transition-colors">Roommate & Teammate</a></li>
                </ul>
              </div>

              {/* Contact & Socials Column */}
              <div className="space-y-3">
                <h4 className="text-sm font-bold text-white uppercase tracking-wider">Contact & Inquiries</h4>
                <p className="text-xs text-slate-400">
                  Interested in piloting CampusConnect at your college?
                </p>
                
                {/* Contact Email Placeholder Box */}
                <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800 space-y-1.5">
                  <span className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Official Inquiries</span>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-mono text-brand-300 font-bold select-all">
                      {emailPlaceholder}
                    </span>
                    <button
                      onClick={handleCopyEmail}
                      title="Copy placeholder email"
                      className="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition-colors"
                    >
                      <Icons.Copy className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>

                {/* Social Media Links Placeholders */}
                <div className="pt-2">
                  <span className="text-[11px] text-slate-500 block mb-2">Connect with our team:</span>
                  <div className="flex space-x-2">
                    {[
                      { name: 'X / Twitter', tag: '@CampusConnect' },
                      { name: 'Instagram', tag: '@CampusConnectApp' },
                      { name: 'LinkedIn', tag: 'CampusConnect-Startup' }
                    ].map(s => (
                      <button
                        key={s.name}
                        onClick={() => onTriggerToast(`Social placeholder for ${s.name} (${s.tag})`)}
                        className="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 hover:text-white transition-colors"
                      >
                        {s.name}
                      </button>
                    ))}
                  </div>
                </div>

              </div>

            </div>

            {/* Copyright & Startup Disclaimer */}
            <div className="pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 space-y-3 sm:space-y-0">
              <p>
                © 2026 CampusConnect. All Rights Reserved.
              </p>
              <div className="flex items-center space-x-4">
                <span>Designed exclusively for college students</span>
                <span>•</span>
                <span>Innovative Startup Concept</span>
              </div>
            </div>

          </div>
        </footer>
      );
    };

    // --- INTERACTIVE MODAL: "GET STARTED / EARLY ACCESS" ---
    const GetStartedModal = ({ isOpen, onClose, defaultRole = 'student', onTriggerToast }) => {
      const [role, setRole] = useState(defaultRole);
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        college: '',
        roleDetail: '',
        interest: ['Events', 'Buy & Sell']
      });
      const [isSubmitted, setIsSubmitted] = useState(false);

      useEffect(() => {
        setRole(defaultRole);
      }, [defaultRole]);

      if (!isOpen) return null;

      const handleInterestToggle = (item) => {
        if (formData.interest.includes(item)) {
          setFormData({ ...formData, interest: formData.interest.filter(i => i !== item) });
        } else {
          setFormData({ ...formData, interest: [...formData.interest, item] });
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.email || !formData.college) {
          alert('Please fill in your name, email, and university name.');
          return;
        }
        setIsSubmitted(true);
        onTriggerToast("🎉 Welcome to CampusConnect Early Access queue!");
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-in fade-in duration-200">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative max-h-[92vh] overflow-y-auto">
            
            <button
              onClick={onClose}
              className="absolute top-5 right-5 p-2 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"
              aria-label="Close modal"
            >
              <Icons.Close className="w-5 h-5" />
            </button>

            {!isSubmitted ? (
              <div>
                <div className="flex items-center space-x-2 text-xs font-bold text-brand-600 uppercase tracking-wider mb-1">
                  <Icons.Sparkles className="w-4 h-4" />
                  <span>Early Prototype Access</span>
                </div>
                
                <h3 className="text-2xl font-black text-slate-900">
                  Be First on CampusConnect
                </h3>
                <p className="text-sm text-slate-600 mt-1 mb-6">
                  Join our verified campus rollout waitlist or bring CampusConnect to your college campus.
                </p>

                {/* Role Toggle Selector */}
                <div className="grid grid-cols-2 p-1 bg-slate-100 rounded-xl mb-5">
                  <button
                    type="button"
                    onClick={() => setRole('student')}
                    className={`py-2 text-xs font-bold rounded-lg transition-all ${
                      role === 'student'
                        ? 'bg-white text-brand-700 shadow-sm'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    I'm a College Student
                  </button>
                  <button
                    type="button"
                    onClick={() => setRole('university')}
                    className={`py-2 text-xs font-bold rounded-lg transition-all ${
                      role === 'university'
                        ? 'bg-white text-accent-700 shadow-sm'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    College / Club Lead
                  </button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      Full Name *
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Alex Morgan"
                      value={formData.name}
                      onChange={e => setFormData({ ...formData, name: e.target.value })}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      {role === 'student' ? 'College / Student Email *' : 'Official Academic Email *'}
                    </label>
                    <input
                      type="email"
                      required
                      placeholder={role === 'student' ? 'yourname@college.edu' : 'lead@university.edu'}
                      value={formData.email}
                      onChange={e => setFormData({ ...formData, email: e.target.value })}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      College / University Name *
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Stanford University / Tech Institute"
                      value={formData.college}
                      onChange={e => setFormData({ ...formData, college: e.target.value })}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      What features are you most excited about?
                    </label>
                    <div className="flex flex-wrap gap-2">
                      {['Buy & Sell', 'Lost & Found', 'Events & RSVPs', 'Clubs Directory', 'Roommate & Teammates'].map(item => (
                        <button
                          type="button"
                          key={item}
                          onClick={() => handleInterestToggle(item)}
                          className={`text-xs px-3 py-1.5 rounded-lg border font-medium transition-colors ${
                            formData.interest.includes(item)
                              ? 'bg-brand-50 text-brand-700 border-brand-300 font-bold'
                              : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                          }`}
                        >
                          {formData.interest.includes(item) && '✓ '}
                          {item}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="pt-2">
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-600 to-accent-700 hover:from-brand-700 hover:to-accent-800 text-white font-bold text-sm shadow-lg shadow-brand-500/25 transition-all"
                    >
                      {role === 'student' ? 'Request Student Early Access' : 'Schedule Campus Demo'}
                    </button>
                  </div>
                </form>

                <p className="text-[11px] text-slate-400 text-center mt-4">
                  We respect your privacy. No spam, ever.
                </p>
              </div>
            ) : (
              <div className="text-center py-6 space-y-4">
                <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto">
                  <Icons.Check className="w-8 h-8" />
                </div>
                <h3 className="text-2xl font-black text-slate-900">
                  You’re on the Priority List!
                </h3>
                <p className="text-sm text-slate-600 max-w-sm mx-auto">
                  Thank you, <strong>{formData.name}</strong>. We've reserved your prototype invitation for <strong>{formData.college}</strong>.
                </p>

                {/* Simulated Pass */}
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-left space-y-2 mt-4 font-mono text-xs">
                  <div className="flex justify-between text-slate-400">
                    <span>PASS STATUS:</span>
                    <span className="text-emerald-600 font-bold">CONFIRMED (VIP)</span>
                  </div>
                  <div className="flex justify-between text-slate-800">
                    <span>EMAIL:</span>
                    <span className="font-semibold">{formData.email}</span>
                  </div>
                  <div className="flex justify-between text-slate-800">
                    <span>INSTITUTION:</span>
                    <span className="font-semibold">{formData.college}</span>
                  </div>
                </div>

                <div className="pt-4">
                  <button
                    onClick={onClose}
                    className="w-full py-3 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 transition-colors"
                  >
                    Return to CampusConnect
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    // --- INTERACTIVE FEATURE DEEP-DIVE MODAL ---
    const FeatureDetailModal = ({ feature, onClose, onOpenGetStarted }) => {
      if (!feature) return null;
      const IconC = feature.icon;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-in fade-in duration-200">
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative max-h-[92vh] overflow-y-auto">
            
            <button
              onClick={onClose}
              className="absolute top-5 right-5 p-2 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"
              aria-label="Close modal"
            >
              <Icons.Close className="w-5 h-5" />
            </button>

            <div className="flex items-center space-x-3 mb-4">
              <div className={`w-12 h-12 rounded-xl bg-gradient-to-tr ${feature.color} text-white flex items-center justify-center shadow-md`}>
                <IconC className="w-6 h-6" />
              </div>
              <div>
                <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${feature.tagColor}`}>
                  {feature.subtitle}
                </span>
                <h3 className="text-2xl font-black text-slate-900">{feature.title}</h3>
              </div>
            </div>

            <p className="text-sm text-slate-600 leading-relaxed mb-6">
              {feature.description}
            </p>

            <h4 className="text-xs font-bold text-slate-900 uppercase tracking-wider mb-3">
              Key Capabilities Designed For Students:
            </h4>
            <ul className="space-y-2.5 mb-8">
              {feature.highlights.map((h, i) => (
                <li key={i} className="text-xs text-slate-700 flex items-start space-x-2.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                  <Icons.Check className="w-4 h-4 text-emerald-600 shrink-0 mt-0.5" />
                  <span className="font-medium">{h}</span>
                </li>
              ))}
            </ul>

            <div className="pt-2 flex space-x-3">
              <button
                onClick={() => {
                  onClose();
                  onOpenGetStarted('student');
                }}
                className="flex-1 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold transition-all shadow-md"
              >
                Get Started with {feature.title}
              </button>
              <button
                onClick={onClose}
                className="px-5 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    };

    // --- MAIN APP CONTROLLER ---
    function App() {
      const [getStartedModalOpen, setGetStartedModalOpen] = useState(false);
      const [getStartedDefaultRole, setGetStartedDefaultRole] = useState('student');
      const [selectedFeatureDetail, setSelectedFeatureDetail] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      const triggerToast = (msg) => {
        setToastMessage(msg);
      };

      const handleOpenGetStarted = (role = 'student') => {
        setGetStartedDefaultRole(role);
        setGetStartedModalOpen(true);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Navigation Bar */}
          <Navbar 
            onOpenGetStarted={handleOpenGetStarted} 
          />

          {/* Main Landing Page Content */}
          <main className="flex-grow">
            {/* Section 1: Hero */}
            <HeroSection 
              onOpenGetStarted={handleOpenGetStarted}
              onOpenFeaturePreview={() => {}}
            />

            {/* Section 2: The Problem */}
            <ProblemSection />

            {/* Section 3: Our Solution (5 Core Features) */}
            <FeaturesSection 
              onSelectFeatureDetail={(feat) => setSelectedFeatureDetail(feat)}
            />

            {/* Section 4: Why CampusConnect? */}
            <WhyUsSection />

            {/* Section 5: How It Works */}
            <HowItWorksSection 
              onOpenGetStarted={handleOpenGetStarted}
            />

            {/* Section 6: Call To Action */}
            <CTASection 
              onOpenGetStarted={handleOpenGetStarted}
            />
          </main>

          {/* Section 7: Footer */}
          <Footer 
            onTriggerToast={triggerToast}
          />

          {/* Modals */}
          <GetStartedModal 
            isOpen={getStartedModalOpen}
            onClose={() => setGetStartedModalOpen(false)}
            defaultRole={getStartedDefaultRole}
            onTriggerToast={triggerToast}
          />

          <FeatureDetailModal 
            feature={selectedFeatureDetail}
            onClose={() => setSelectedFeatureDetail(null)}
            onOpenGetStarted={handleOpenGetStarted}
          />

          {/* Toast Notification */}
          {toastMessage && (
            <Toast 
              message={toastMessage} 
              onClose={() => setToastMessage(null)} 
            />
          )}

          {/* Floating Back-To-Top Pill */}
          <a
            href="#hero"
            aria-label="Back to top"
            className="fixed bottom-6 left-6 z-30 p-3 rounded-full bg-white/90 hover:bg-white text-slate-700 shadow-lg border border-slate-200 transition-all hover:scale-110 active:scale-95 hidden sm:flex items-center justify-center"
          >
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
          </a>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
